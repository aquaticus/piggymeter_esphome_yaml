esphome:
  name: kamstrup
  friendly_name: kamstrup
  comment: "PiggyMeter IEC62056-21"

esp32:
  variant: esp32s2
  board: lolin_s2_mini
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
api:
  encryption:
    key: !secret kamstrup_api_key

ota:
  - platform: esphome
    encryption:

external_components:
    # IEC62056-21 component
  - source: github://aquaticus/esphome-iec62056

uart:
  - id: uart_meter
    rx_pin: GPIO11
    tx_pin: GPIO12
    baud_rate: 300
    data_bits: 7
    parity: EVEN
    stop_bits: 1

switch:
  - platform: gpio
    pin: GPIO15
    name: Internal LED
    id: led_switch
    internal: True

  - platform: iec62056
    name: 'Readout Trigger'
    id: 'readout_trigger'

binary_sensor:
  - platform: iec62056
    id: meter_status
    name: Meter Connection Status
    on_press:
      then:
        - switch.turn_on: led_switch
    on_release:
      then:
        - switch.turn_off: led_switch

iec62056:
  update_interval: 60s
  bcc: sum

# OBIS codes sent by the Kamstrup 685-382 in IEC 61107 mode A:
#   0.0 meter/customer no., 1.20 energy total, 1.20.1/1.20.2 tariff 1/2,
#   1.31 hour counter, 1.26 counter (meaning unknown, 0 here), 1.6 peak power, 1.6*1 previous peak

text_sensor:
  - platform: iec62056
    name: Meter number
    obis: "0.0"
    entity_category: diagnostic

sensor:
  - platform: iec62056
    name: Energy total
    obis: "1.20"
    unit_of_measurement: kWh
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing

  - platform: iec62056
    name: Energy tariff 1
    obis: "1.20.1"
    unit_of_measurement: kWh
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing

  - platform: iec62056
    name: Energy tariff 2
    obis: "1.20.2"
    unit_of_measurement: kWh
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing

  - platform: iec62056
    name: Operating hours
    obis: "1.31"
    unit_of_measurement: h
    accuracy_decimals: 0
    device_class: duration
    state_class: total_increasing
    entity_category: diagnostic

  - platform: iec62056
    name: Counter 1.26
    obis: "1.26"
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: iec62056
    name: Peak power
    obis: "1.6"
    unit_of_measurement: kW
    accuracy_decimals: 1
    device_class: power
    state_class: measurement

  - platform: iec62056
    name: Peak power previous period
    obis: "1.6*1"
    unit_of_measurement: kW
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
