# The following configuration is for the Iskra (Iskraemeco) MT174 electric meter.
# Replace the Sensor section with the one below.
#
# The MT174 is common in Poland (ENEA / Tauron / Energa) and speaks IEC 62056-21
# mode C: it answers /?! (identifies as /ISk5MT174-...) and negotiates up to 9600 baud.
#
# IMPORTANT - one non-obvious requirement for the MT174:
#   The PiggyMeter optical head is half-duplex, so the /?! request echoes back into RX.
#   Without an RX debug tap the component mis-parses that echo and logs
#   "Invalid identification frame" on every readout. Adding a *non-consuming* RX tap
#   changes the UART read timing just enough that the echo is handled and mode C works.
#   Add this to the `uart:` block in piggymeter-common.yaml:
#
#     debug:
#       direction: RX
#       dummy_receiver: false
#       after:
#         timeout: 500ms
#       sequence:
#         - lambda: UARTDebug::log_string(direction, bytes);
#
# Full config (on-device analytics: tan phi / reactive-penalty alarm, runtime mode/baud
# tuning, formatted clock, etc.) and detailed notes:
#   https://github.com/jotuera/piggymeter-iskra-mt174

sensor:
  # --- Active energy import ---
  - platform: iec62056
    obis: "1-0:1.8.0*255"
    name: Positive active energy total
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing
  - platform: iec62056
    obis: "1-0:1.8.1*255"
    name: Positive active energy in tariff 1
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing
  - platform: iec62056
    obis: "1-0:1.8.2*255"
    name: Positive active energy in tariff 2
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing

  # --- Active energy export (0 on a non-PV meter, but reported) ---
  - platform: iec62056
    obis: "1-0:2.8.0*255"
    name: Negative active energy total
    unit_of_measurement: kWh
    accuracy_decimals: 3
    device_class: energy
    state_class: total_increasing

  # --- Reactive energy, 4 quadrants ---
  - platform: iec62056
    obis: "1-0:5.8.0*255"
    name: Reactive energy Q1
    unit_of_measurement: kvarh
    accuracy_decimals: 3
    state_class: total_increasing
  - platform: iec62056
    obis: "1-0:6.8.0*255"
    name: Reactive energy Q2
    unit_of_measurement: kvarh
    accuracy_decimals: 3
    state_class: total_increasing
  - platform: iec62056
    obis: "1-0:7.8.0*255"
    name: Reactive energy Q3
    unit_of_measurement: kvarh
    accuracy_decimals: 3
    state_class: total_increasing
  - platform: iec62056
    obis: "1-0:8.8.0*255"
    name: Reactive energy Q4
    unit_of_measurement: kvarh
    accuracy_decimals: 3
    state_class: total_increasing

  # --- Power ---
  - platform: iec62056
    obis: "1-0:1.5.0*255"
    name: Average power
    unit_of_measurement: kW
    accuracy_decimals: 3
    device_class: power
    state_class: measurement
  - platform: iec62056
    obis: "1-0:1.6.0*255"
    name: Maximum demand
    unit_of_measurement: kW
    accuracy_decimals: 3
    device_class: power
    state_class: measurement

  # --- Diagnostics ---
  - platform: iec62056
    obis: "0-0:C.7.0*255"
    name: Power failure count
    accuracy_decimals: 0
    state_class: total_increasing

text_sensor:
  - platform: iec62056
    obis: "1-0:0.0.0*255"
    name: Meter serial number
  - platform: iec62056
    obis: "1-0:0.9.1*255"
    name: Meter time
  - platform: iec62056
    obis: "1-0:0.9.2*255"
    name: Meter date
